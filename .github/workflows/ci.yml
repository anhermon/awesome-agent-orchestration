name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly link check (Monday 09:00 UTC)
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  audit-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests

  awesome-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run awesome-lint
        env:
          # awesome-lint reads lowercase github_token for API checks
          github_token: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes awesome-lint

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check README
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 8
            --timeout 20
            --accept 200,204,206,301,302,307,308
            README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
